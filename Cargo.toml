[package]
name = "hermes-agent-foundry"
version = "1.0.0"
edition = "2021"
authors = ["Bagas Cihuy <bagas.office01@gmail.com>"]
description = "Zero-code, modular, algorithmic agent creation platform powered by Hermes Agent Runtime in Rust"
license = "Proprietary"

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }

# Graph & Algorithmic DAG
petgraph = "0.6"

# Networking & AI Integration (Menggunakan rustls-tls, murni Rust bebas dependensi C OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Utilities & Observability
sha2 = "0.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[[bin]]
name = "foundry-server"
path = "src/main.rs"
